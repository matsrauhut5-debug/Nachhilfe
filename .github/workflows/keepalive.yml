name: Keep Supabase awake

# The free Supabase plan pauses projects after 7 days without activity.
on:
  schedule:
    - cron: '17 6 */3 * *' # every 3 days, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          answer=$(curl -sf -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Answer: $answer"
          test "$answer" = '"ok"'
