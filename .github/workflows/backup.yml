name: Weekly backup

# Asks the weekly-backup Edge Function to email all data to Mats.
# The backup itself never touches this public repository.
on:
  schedule:
    - cron: '0 18 * * 0' # Sundays 18:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backup email
        env:
          FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          SECRET: ${{ secrets.BACKUP_SECRET }}
        run: |
          code=$(curl -s -o /tmp/answer -w "%{http_code}" -X POST "$FUNCTIONS_URL/weekly-backup" -H "x-backup-secret: $SECRET")
          echo "HTTP $code"
          test "$code" = "200"
