name: Monthly payment report

# On the 1st of each month: email Mats a CSV of last month's lessons (Name, Betrag, Datum, Status).
# The report never touches this public repository.
on:
  schedule:
    - cron: '0 7 1 * *' # 1st of the month, 07:00 UTC
  workflow_dispatch:
    inputs:
      month:
        description: 'Month as YYYY-MM (empty = last month)'
        required: false

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger report email
        env:
          FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          SECRET: ${{ secrets.REPORT_SECRET }}
          MONTH: ${{ inputs.month }}
        run: |
          code=$(curl -s -o /tmp/answer -w "%{http_code}" -X POST "$FUNCTIONS_URL/monthly-report?month=$MONTH" -H "x-report-secret: $SECRET")
          echo "HTTP $code: $(cat /tmp/answer)"
          test "$code" = "200"
